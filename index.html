<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KABYMAS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        header {
            background: #1f1f1f;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        header h1 {
            font-size: 56px;
            margin-bottom: 15px;
        }

        header p {
            font-size: 22px;
        }

        .galeria {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .producto {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,.1);
        }

        .producto img {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }

        .info {
            padding: 20px;
        }

        .info h3 {
            margin-bottom: 15px;
            font-size: 28px;
        }

        .precio {
            color: #118a39;
            font-size: 38px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stock {
            color: #666;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .boton {
            background: #25D366;
            color: white;
            text-decoration: none;
            display: block;
            text-align: center;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
        }

        .boton:hover {
            background: #1ea952;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>KABYMAS</h1>
    <p>🎒 Mochilas • 👜 Bolsos • 👝 Riñoneras • ✨ Accesorios</p>
</header>

<section class="galeria">

    <div class="producto">
        <img src="https://picsum.photos/500/500?random=1" alt="Producto">

        <div class="info">
            <h3>Mochila Urbana</h3>

            <div class="precio">$45.000</div>

            <div class="stock">
                Stock: 3 unidades
            </div>

            <a class="boton" href="#">
                Consultar por WhatsApp
            </a>
        </div>
    </div>

    <div class="producto">
        <img src="https://picsum.photos/500/500?random=2" alt="Producto">

        <div class="info">
            <h3>Riñonera Deportiva</h3>

            <div class="precio">$18.000</div>

            <div class="stock">
                Stock: 5 unidades
            </div>

            <a class="boton" href="#">
                Consultar por WhatsApp
            </a>
        </div>
    </div>

</section>

<footer>
    © KABYMAS
</footer>

</body>

</html>
