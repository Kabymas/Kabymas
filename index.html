<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KABYMAS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
background:#f7f0ea;
color:#5f5755;
}

header{
text-align:center;
padding:50px 20px;
}

header img{
max-width:300px;
width:90%;
}

header p{
margin-top:20px;
font-size:20px;
}

.separador{
width:120px;
height:3px;
background:#d6b4a2;
margin:30px auto;
}

.categorias{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
padding:20px;
}

.categoria{
background:white;
padding:12px 22px;
border-radius:30px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.titulo{
text-align:center;
font-size:32px;
margin-top:40px;
}

.productos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:25px;
padding:40px;
max-width:1200px;
margin:auto;
}

.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:350px;
object-fit:cover;
}

.info{
padding:20px;
}

.nombre{
font-size:22px;
font-weight:bold;
margin-bottom:10px;
}

.precio{
font-size:28px;
color:#c0846b;
font-weight:bold;
margin-bottom:10px;
}

.stock{
margin-bottom:20px;
}

.boton{
display:block;
background:#d6b4a2;
color:white;
text-align:center;
padding:12px;
text-decoration:none;
border-radius:8px;
}

footer{
text-align:center;
padding:50px;
color:#777;
}

</style>

</head>

<body>

<header>

<img src="logo.jpeg" alt="Kabymas">

<p>
Accesorios que te acompañan en cada momento
</p>

<div class="separador"></div>

</header>

<section class="categorias">

<div class="categoria">👜 Bolsos</div>
<div class="categoria">👝 Riñoneras</div>
<div class="categoria">🎒 Mochilas</div>
<div class="categoria">📱 Porta Celulares</div>

</section>

<h2 class="titulo">
Productos Destacados
</h2>

<section class="productos">

<div class="card">

<img src="Producto 1.jpeg">

<div class="info">

<div class="nombre">
Producto
</div>

<div class="precio">
$ 0
</div>

<div class="stock">
Stock disponible
</div>

<a href="#" class="boton">
Próximamente WhatsApp
</a>

</div>

</div>

<div class="card">

<img src="Producto 2.jpeg">

<div class="info">

<div class="nombre">
Producto
</div>

<div class="precio">
$ 0
</div>

<div class="stock">
Stock disponible
</div>

<a href="#" class="boton">
Próximamente WhatsApp
</a>

</div>

</div>

</section>

<footer>

© KABYMAS

</footer>

</body>
</html>
